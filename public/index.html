<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat em Tempo Real</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #chat-container { width: 400px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
        #header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #e9ecef; padding: 8px 12px; border-radius: 6px; max-width: 80%; word-wrap: break-word; }
        .msg .meta { font-size: 0.75em; color: #555; margin-bottom: 4px; }
        #form { display: flex; border-top: 1px solid #ddd; padding: 10px; gap: 5px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #username { width: 30%; }
        #input { flex: 1; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">Chat em Tempo Real</div>
        <div id="messages"></div>
        <form id="form">
            <input id="username" type="text" placeholder="Nome" required />
            <input id="input" type="text" placeholder="Escreva uma mensagem..." autocomplete="off" required />
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        const form = document.getElementById('form');
        const usernameInput = document.getElementById('username');
        const messageInput = document.getElementById('input');
        const messagesDiv = document.getElementById('messages');

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<div class="meta"><strong>${msg.username}</strong> • ${msg.timestamp}</div><div>${msg.text}</div>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        ws.onmessage = (event) => {
            const payload = JSON.parse(event.data);
            if (payload.type === 'history') {
                payload.data.forEach(appendMessage);
            } else if (payload.type === 'message') {
                appendMessage(payload.data);
            }
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (messageInput.value.trim()) {
                ws.send(JSON.stringify({
                    username: usernameInput.value.trim(),
                    text: messageInput.value.trim()
                }));
                messageInput.value = '';
            }
        });
    </script>
</body>
</html>
